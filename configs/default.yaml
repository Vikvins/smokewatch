# Default pipeline settings. All times are in seconds.

pose:
  model: yolo11n-pose.pt  # downloaded automatically on first run
  device: mps             # mps on Apple silicon, cpu elsewhere
  sample_fps: 10          # frames per second sent to the model
  min_person_conf: 0.3
  tracker: bytetrack.yaml

objects:
  enabled: true
  model: yolo11n.pt       # standard COCO detector, downloaded automatically
  device: mps
  sample_fps: 5
  crop_size: 3.0          # head crop side, in shoulder widths
  imgsz: 320              # crops are resized to this before detection
  min_conf: 0.25
  classes: [bottle, wine glass, cup, cell phone]
  max_time_gap_sec: 0.1   # pose and object samples closer than this are compared
  max_wrist_distance: 1.0 # object centre to wrist, in shoulder widths
  min_fraction: 0.3       # share of cycle samples with the object in hand

signal:
  min_keypoint_conf: 0.4
  near_mouth: 0.6     # wrist-to-nose distance (in shoulder widths) to count as "at the mouth"
  far_from_mouth: 1.0 # distance to count as "away"; the gap between the two avoids flicker
  max_gap_sec: 0.5    # short keypoint dropouts are bridged

cycles:
  min_pause_sec: 0.5
  max_pause_sec: 5.0

events:
  min_cycles: 2       # 1 cycle + direct cue is not implemented yet
  window_sec: 20      # the first two cycles must fit into this window
  merge_gap_sec: 15   # cycles of one person closer than this form one event
  threshold: 0.5      # minimum confidence to report an event

evaluation:
  gt_extend_sec: 3
  min_overlap_sec: 1
  min_iou: 0.3
