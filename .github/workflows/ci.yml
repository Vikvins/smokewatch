name: CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Tests do not need the models, so the heavy packages
      # (ultralytics, open_clip / torch) are not installed here.
      - run: pip install numpy opencv-python-headless pandas pyyaml pytest ruff
      - run: pip install -e . --no-deps
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q
